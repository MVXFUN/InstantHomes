name: Build InstantHomes JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build

      - name: Show generated files
        if: always()
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Searching for JAR files:"
          find . -type f -name "*.jar" -print
          echo "Searching for Gradle build files:"
          find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" \) -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: InstantHomes-JAR
          path: build/libs/*.jar
